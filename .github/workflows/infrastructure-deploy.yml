name: Marketplace Infrastructure Deploy

on:
  pull_request:
    paths:
      - "**"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**"

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.7.5
  HELM_VERSION: 3.14.4
  KUBE_VERSION: 1.29.0

concurrency:
  group: marketplace-infrastructure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate IaC and deployment manifests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [development, staging, production]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        working-directory: .
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Terraform format
        run: terraform fmt -check -recursive .

      - name: Terraform init
        run: terraform -chdir=environments/${{ matrix.environment }} init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=environments/${{ matrix.environment }} validate

      - name: Helm lint
        run: helm lint helm/marketplace --values helm/marketplace/values-${{ matrix.environment }}.yaml --strict

      - name: Helm render
        run: helm template marketplace helm/marketplace --values helm/marketplace/values-${{ matrix.environment }}.yaml > /tmp/marketplace-${{ matrix.environment }}.yaml

      - name: Kubernetes schema validation
        run: |
          kubeconform -strict -ignore-missing-schemas -kubernetes-version "$KUBE_VERSION" \
            kubernetes/**/*.yaml /tmp/marketplace-${{ matrix.environment }}.yaml

      - name: Compose validation
        if: matrix.environment == 'development'
        run: docker compose config >/dev/null

      - name: Repository validation
        run: REQUIRE_EXTERNAL_TOOLS=0 ./scripts/validate.sh

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Checkov policy scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes,helm,dockerfile
          quiet: true
          soft_fail: false

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    name: Plan, apply, and deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: security
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform plan and guarded apply
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_certificate_arn: ${{ secrets.CERTIFICATE_ARN }}
          ALLOW_DESTRUCTIVE_CHANGES: ${{ vars.ALLOW_DESTRUCTIVE_CHANGES }}
        run: |
          terraform -chdir=environments/staging init -input=false
          terraform -chdir=environments/staging plan -input=false -lock-timeout=10m -out=tfplan
          terraform -chdir=environments/staging show -json tfplan > environments/staging/tfplan.json
          bash ./scripts/check-plan.sh environments/staging/tfplan.json
          terraform -chdir=environments/staging apply -input=false -lock-timeout=10m tfplan

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name marketplace-staging

      - name: Helm deploy
        run: |
          helm upgrade --install marketplace helm/marketplace \
            --namespace marketplace-staging --create-namespace \
            --values helm/marketplace/values-staging.yaml \
            --set global.imageTag="${GITHUB_SHA}" \
            --atomic --wait --timeout 15m

      - name: Verify rollout
        run: kubectl rollout status deployment -n marketplace-staging --timeout=10m

  deploy-production:
    name: Plan, apply, and deploy production
    if: startsWith(github.ref, 'refs/tags/v')
    needs: security
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform plan and apply
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_certificate_arn: ${{ secrets.CERTIFICATE_ARN }}
          ALLOW_DESTRUCTIVE_CHANGES: ${{ vars.ALLOW_DESTRUCTIVE_CHANGES }}
        run: |
          terraform -chdir=environments/production init -input=false
          terraform -chdir=environments/production plan -input=false -lock-timeout=10m -out=tfplan
          terraform -chdir=environments/production show -json tfplan > environments/production/tfplan.json
          bash ./scripts/check-plan.sh environments/production/tfplan.json
          terraform -chdir=environments/production apply -input=false -lock-timeout=10m tfplan

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name marketplace-production

      - name: Helm deploy
        run: |
          helm upgrade --install marketplace helm/marketplace \
            --namespace marketplace-production --create-namespace \
            --values helm/marketplace/values-production.yaml \
            --set global.imageTag="${GITHUB_REF_NAME}" \
            --atomic --wait --timeout 20m

      - name: Verify rollout
        run: kubectl rollout status deployment -n marketplace-production --timeout=15m

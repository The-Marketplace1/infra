{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketplace
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "marketplace.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - secretName: {{ .Values.ingress.tlsSecretName }}
      hosts:
        - {{ .Values.ingress.hosts.api }}
        - {{ .Values.ingress.hosts.customer }}
        - {{ .Values.ingress.hosts.professional }}
        - {{ .Values.ingress.hosts.admin }}
  rules:
    - host: {{ .Values.ingress.hosts.api }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: api-gateway, port: { number: 8080 } } }
    - host: {{ .Values.ingress.hosts.customer }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: customer-app, port: { number: 3000 } } }
    - host: {{ .Values.ingress.hosts.professional }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: professional-app, port: { number: 3001 } } }
    - host: {{ .Values.ingress.hosts.admin }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: admin-dashboard, port: { number: 3002 } } }
{{- end }}

{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.storeName }}
  namespace: {{ .Values.global.namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.global.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "marketplace.serviceAccountName" . }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: marketplace-runtime
  namespace: {{ .Values.global.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: SecretStore
  target:
    name: {{ .Values.externalSecrets.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: {{ .Values.externalSecrets.awsSecretPrefix }}/database, property: url }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: {{ .Values.externalSecrets.awsSecretPrefix }}/redis, property: auth_token }
    - secretKey: JWT_SECRET
      remoteRef: { key: {{ .Values.externalSecrets.awsSecretPrefix }}/jwt, property: signing_key }
    - secretKey: PAYMENT_PROVIDER_KEY
      remoteRef: { key: {{ .Values.externalSecrets.awsSecretPrefix }}/payment, property: secret_key }
{{- end }}

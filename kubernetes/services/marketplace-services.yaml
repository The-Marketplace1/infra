---
apiVersion: v1
kind: Service
metadata: { name: payment-service, namespace: marketplace-production }
spec:
  selector: { app.kubernetes.io/name: payment-service }
  ports: [{ name: http, port: 8083, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: notification-service, namespace: marketplace-production }
spec:

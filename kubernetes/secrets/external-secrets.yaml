apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: marketplace-secrets
  namespace: marketplace-production
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: marketplace-secrets-reader
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: marketplace-runtime-secrets
  namespace: marketplace-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: marketplace-secrets
    kind: SecretStore
  target:
    name: marketplace-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: marketplace/production/database
        property: url
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: marketplace/production/redis
        property: auth_token
    - secretKey: JWT_SECRET
      remoteRef:
        key: marketplace/production/jwt
        property: signing_key
    - secretKey: PAYMENT_PROVIDER_KEY
      remoteRef:
        key: marketplace/production/payment
        property: secret_key
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: marketplace-secrets-reader
  namespace: marketplace-production
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_TERRAFORM_OUTPUT_SECRETS_ROLE_ARN

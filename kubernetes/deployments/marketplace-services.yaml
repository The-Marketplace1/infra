apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: marketplace-production
  labels: { app.kubernetes.io/name: api-gateway, app.kubernetes.io/part-of: marketplace }
spec:
  replicas: 3
  selector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app.kubernetes.io/name: api-gateway, app.kubernetes.io/part-of: marketplace } }
    spec:
      serviceAccountName: marketplace-workload
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api-gateway
          image: ghcr.io/marketplace/api-gateway:latest
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: marketplace-runtime } }, { secretRef: { name: marketplace-runtime-secrets } }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api-gateway, namespace: marketplace-production }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway }
  minReplicas: 3
  maxReplicas: 20
  behavior: { scaleDown: { stabilizationWindowSeconds: 300 } }
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: backend-api, namespace: marketplace-production }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend-api }
  minReplicas: 4
  maxReplicas: 30
  behavior: { scaleDown: { stabilizationWindowSeconds: 300 } }
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: realtime-service, namespace: marketplace-production }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: realtime-service }
  minReplicas: 3
  maxReplicas: 20
  behavior: { scaleDown: { stabilizationWindowSeconds: 600 } }
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } } }]

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketplace
  namespace: marketplace-production
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [marketplace.example.com, api.marketplace.example.com]
      secretName: marketplace-tls
  rules:
    - host: api.marketplace.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: api-gateway, port: { number: 8080 } } }
    - host: marketplace.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: customer-app, port: { number: 3000 } } }
    - host: professionals.marketplace.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: professional-app, port: { number: 3001 } } }
    - host: admin.marketplace.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: admin-dashboard, port: { number: 3002 } } }
